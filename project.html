<html>

        </div>
        <a href="mailto:arunprasanthm7@gmail.com" id="mailID">arunprasanthm7@gmail.com</a>

      </div>
      <div class="flex flex-col justify-center items-center gap-24 mt-40 mb-40">

    <style>
      #projectHeader{
  justify-content: space-between;
  width: 1024px;
  margin-top: 70px; 
      }
  #projHome{
      border-radius: 7px;
      padding: 2px 8px;
  }
  #projHome:hover{
    background-color: rgba(0, 0, 0, 0.2);
  }
  .proj-title,.parent-tech-tagline{
    color: var(--black);
  }
  #projectNavContainer{

  height: 40px;

  border-radius: 10px;
  background-color: var(--white);
  color:var(--black);

  padding-left: 5px;

  gap: 8px;
    }
    .proj-nav-active{
      background-color: rgba(0, 0, 0, 0.2);

      padding: 2px 8px;
    }
      .ap {
        background-color: rgb(201, 197, 197);
      }
      .tech-icon{
        width:60px;
        height: 60px; 
       }
       .parent-tech-tagline{
        font-size:28px;
        font-weight: 700;
       }
       .used-tech-top{

       }
